version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 446205069645.dkr.ecr.us-east-1.amazonaws.com
      - IMAGE_URI=446205069645.dkr.ecr.us-east-1.amazonaws.com/therascout-backend:latest
  build:
    commands:
      - mkdir -p backend/data && cp data/schema.sql backend/data/schema.sql || true
      - docker build -t $IMAGE_URI backend/
  post_build:
    commands:
      - docker push $IMAGE_URI
      - echo "Image pushed to $IMAGE_URI"
      - printf '[{"name":"therascout-backend","imageUri":"%s"}]' $IMAGE_URI > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
